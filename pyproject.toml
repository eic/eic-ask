[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "eic-ask"
dynamic = ["version"]
description = "Command-line interface for the EIC Documentation query API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
eic-ask = "eic_ask.cli:main"

[tool.setuptools]
packages = ["eic_ask"]

[tool.setuptools_scm]
